<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - SoraTools</title>
    <meta name="description"
      content="Contacte SoraTools via un formulaire simple envoyé avec EmailJS.">
    <link rel="icon" type="image/png" href="/assets/logo.png">
    <link rel="shortcut icon" type="image/png" href="/assets/logo.png">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/suggest.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Intel+One+Mono:ital,wght@0,300..700;1,300..700&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Science+Gothic:wght@100..900&display=swap"
      rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="module" src="/js/contact.js"></script>
    <script type="module" src="/js/global.js"></script>
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar">
        <a class="logo" href="/"
          data-label="Retourner à l'accueil SoraTools"><img class="logo-img"
            src="/assets/logo.png" alt aria-hidden="true">SoraTools</a>
        <div class="nav-links">
          <a href="/#tools" data-label="Aller au catalogue des tools">Tools</a>
          <a href="/suggest"
            data-label="Aller aux suggestions de tools">Suggest</a>
          <a href="/contact" data-label="Aller à la page contact">Contact</a>
          <a href="/tools/color-picker"
            data-label="Ouvrir le Color Picker">Color Picker</a>
          <a href="/tools/json-formatter"
            data-label="Ouvrir le JSON Formatter">JSON</a>
          <a href="/tools/regex-tester"
            data-label="Ouvrir le Regex Tester">Regex</a>
          <a href="/tools/md-previewer"
            data-label="Ouvrir le Markdown Previewer">Markdown</a>
          <a href="/tools/base64"
            data-label="Ouvrir le Base64 Encoder">Base64</a>
        </div>
      </nav>
    </header>

    <main>
      <section class="section suggest-section" id="contact">
        <div class="section-heading">
          <p class="eyebrow">Contact</p>
          <h1>Envoyer un message</h1>
          <p>Une question, un retour ou un problème ? Envoie un message ici. Un
            cooldown de 30 minutes est appliqué entre chaque envoi.</p>
        </div>

        <div class="suggest-card">
          <form class="suggest-form" data-contact-form>
            <div class="suggest-grid">
              <label class="suggest-field">
                <span>Nom</span>
                <input type="text" data-contact-name name="name" maxlength="60"
                  autocomplete="name" placeholder="Ex : Sora" required>
              </label>

              <label class="suggest-field">
                <span>Sujet</span>
                <input type="text" data-contact-subject name="subject"
                  maxlength="100" placeholder="Ex : Bug sur un tool" required>
              </label>
            </div>

            <label class="suggest-field">
              <span>Message</span>
              <textarea data-contact-message name="message" maxlength="2000"
                placeholder="Écris ton message..." required></textarea>
            </label>

            <div class="suggest-captcha">
              <div class="suggest-field">
                <span class="suggest-captcha-label">Captcha</span>
                <div class="suggest-captcha-question"
                  data-contact-captcha-question>...</div>
              </div>

              <label class="suggest-field">
                <span>Réponse</span>
                <input type="number" data-contact-captcha placeholder="Résultat"
                  required>
              </label>
            </div>

            <div class="suggest-actions">
              <button type="submit" data-contact-submit
                data-label="Envoyer le message">Envoyer</button>
              <p class="suggest-cooldown" data-contact-cooldown></p>
            </div>

            <p class="suggest-status" data-contact-status>En attente.</p>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>SoraTools - Contact.</p>
    </footer>
  </body>
</html>
