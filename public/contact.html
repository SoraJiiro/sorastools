<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - SoraTools</title>
    <meta name="description"
      content="Contacte SoraTools via un formulaire simple envoyé avec EmailJS.">
    <link rel="icon" type="image/png" href="/assets/logo.png">
    <link rel="shortcut icon" type="image/png" href="/assets/logo.png">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/forms.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Intel+One+Mono:ital,wght@0,300..700;1,300..700&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Science+Gothic:wght@100..900&display=swap"
      rel="stylesheet">
    <script
      src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="module" src="/js/contact.js"></script>
    <script type="module" src="/js/global.js"></script>
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar">
        <a class="logo" href="/"
          data-label="Retourner à l'accueil SoraTools"><img class="logo-img"
            src="/assets/logo.png" alt aria-hidden="true">SoraTools</a>
        <div class="nav-links">
          <a href="/#tools" data-label="Aller au catalogue des Tools">Accueil
            <a href="/suggest"
              data-label="Aller aux suggestions de tools">Suggest</a>
            <a href="/contact" data-label="Aller à la page contact">Contact</a>
          </div>
        </nav>
      </header>

      <main>
        <div class="section-heading">
          <p class="eyebrow">Contact</p>
          <h1>Envoyer un message</h1>
          <p>Une question, un retour ou un problème ? Envoie un message ici ! Je
            lis vos messages régulièrement.</p>
        </div>

        <section class="section form-section" id="contact">
          <div class="form-card">
            <form class="form" data-contact-form>
              <div class="form-grid">
                <label class="form-field">
                  <span>Nom</span>
                  <input type="text" data-contact-name name="name"
                    maxlength="60"
                    autocomplete="name" placeholder="Ex : Sora" required>
                </label>

                <label class="form-field">
                  <span>Sujet</span>
                  <input type="text" data-contact-subject name="subject"
                    maxlength="100" placeholder="Ex : Bug sur un tool" required>
                </label>
              </div>

              <label class="form-field">
                <span>Message</span>
                <textarea data-contact-message name="message" maxlength="2000"
                  placeholder="Écris ton message..." required></textarea>
              </label>

              <div class="form-captcha">
                <div class="form-field">
                  <span class="form-captcha-label">Captcha</span>
                  <div class="form-captcha-question"
                    data-contact-captcha-question>...</div>
                </div>

                <label class="form-field">
                  <span>Réponse</span>
                  <input type="number" data-contact-captcha
                    placeholder="Résultat"
                    required>
                </label>
              </div>

              <div class="form-actions">
                <button type="submit" data-contact-submit
                  data-label="Envoyer le message">Envoyer</button>
                <p class="contact-cooldown" data-contact-cooldown></p>
              </div>

              <p class="form-status" data-contact-status>En attente.</p>
            </form>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <p>&copy; 2026 SoraTools. Tous droits réservés.</p>
        <p>Contact</p>
      </footer>
    </body>
  </html>
