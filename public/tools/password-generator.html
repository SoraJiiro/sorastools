<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Password Generator - SorasTools</title>
        <link rel="canonical" href="https://sorastools.onrender.com/tools/password-generator">
        <meta name="description"
            content="Génère un mot de passe aléatoire avec des options de longueur et de caractères.">
        <link rel="icon" type="image/png" href="/assets/logo.png">
        <link rel="shortcut icon" type="image/png" href="/assets/logo.png">
        <link rel="stylesheet" href="/css/global.css">
        <link rel="stylesheet" href="/css/password-generator.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Intel+One+Mono:ital,wght@0,300..700;1,300..700&family=Roboto+Condensed:wght@100..900&family=Science+Gothic:wght@100..900&display=swap"
            rel="stylesheet">
        <script type="module" src="/js/tools/password-generator.js"></script>
        <script type="module" src="/js/global.js"></script>
    </head>
    <body>
        <header class="site-header">
            <nav class="navbar">
                <a class="logo" href="/"
                    data-label="Retourner à l'accueil SorasTools"><img
                        class="logo-img"
                        src="/assets/logo.png" alt
                        aria-hidden="true">SorasTools</a>
                <div class="nav-links">
                    <a href="/#tools"
                        data-label="Aller au catalogue des Tools">Accueil</a>
                    <a href="/suggest"
                        data-label="Aller aux suggestions de tools">Suggest</a>
                    <a href="/contact"
                        data-label="Aller à la page contact">Contact</a>
                </div>
            </nav>
        </header>
        <main>
            <section class="section tool-section" id="password-generator">
                <div class="section-heading">
                    <p class="eyebrow">Sécurité</p>
                    <h1>Password Generator</h1>
                    <p>Crée un mot de passe aléatoire avec les caractères de ton
                        choix.</p>
                </div>
                <div class="password-tool" id="tool-panel">
                    <div class="password-controls">
                        <label class="field password-length"
                            data-label="Longueur du mot de passe">
                            <span>Longueur <output
                                    data-password-length-value>20</output></span>
                            <input type="range" min="8" max="64" value="20"
                                data-password-length>
                        </label>
                        <fieldset class="password-groups">
                            <legend>Inclure</legend>
                            <label><input type="checkbox"
                                    data-password-group="lowercase" checked>
                                Minuscules (a-z)</label>
                            <label><input type="checkbox"
                                    data-password-group="uppercase" checked>
                                Majuscules (A-Z)</label>
                            <label><input type="checkbox"
                                    data-password-group="digits" checked>
                                Chiffres (0-9)</label>
                            <label><input type="checkbox"
                                    data-password-group="symbols" checked>
                                Symboles (!@#…)</label>
                        </fieldset>
                        <button class="password-generate" type="button"
                            data-password-generate
                            data-label="Générer un nouveau mot de passe">Générer</button>
                    </div>
                    <div class="password-result">
                        <label class="field" for="generated-password">
                            <span>Mot de passe</span>
                            <input id="generated-password" type="text"
                                data-password-output
                                readonly autocomplete="off" autocapitalize="off"
                                spellcheck="false">
                        </label>
                        <button class="password-copy" type="button"
                            data-password-copy
                            data-label="Copier le mot de passe"
                            disabled>Copier</button>
                        <p class="password-status" data-password-status
                            aria-live="polite">Prêt.</p>
                        <p class="password-privacy">Généré sur cet appareil avec
                            Web Crypto; rien n'est envoyé au serveur.</p>
                    </div>
                </div>
            </section>
        </main>
        <footer class="site-footer">
            <p>&copy; <span class="date"></span> SorasTools - Tous droits
                réservés.</p>
            <p class="location"></p>
        </footer>
    </body>
</html>
