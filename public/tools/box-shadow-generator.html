<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CSS Box Shadow Generator - SoraTool</title>
        <meta name="description"
            content="Génère visuellement des box-shadow CSS avec aperçu en direct.">
        <link rel="icon" type="image/png" href="/assets/logo.png">
        <link rel="stylesheet" href="/css/global.css">
        <link rel="stylesheet" href="/css/box-shadow-generator.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Intel+One+Mono:ital,wght@0,300..700;1,300..700&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Science+Gothic:wght@100..900&display=swap"
            rel="stylesheet">
        <script type="module" src="/js/tools/box-shadow-generator.js"></script>
        <script type="module" src="/js/global.js"></script>
    </head>
    <body>
        <header class="site-header">
            <nav class="navbar">
                <a class="logo" href="/"
                    data-label="Retourner à l'accueil SoraTool"><img
                        class="logo-img" src="/assets/logo.png" alt
                        aria-hidden="true">SoraTool</a>
                <div class="nav-links">
                    <a href="/#tools"
                        data-label="Aller au catalogue des Tools">Accueil</a>
                    <a href="/suggest"
                        data-label="Aller aux suggestions de tools">Suggest</a>
                    <a href="/contact"
                        data-label="Aller à la page contact">Contact</a>
                </div>
            </nav>
        </header>
        <main>
            <section class="section tool-section" id="box-shadow-generator">
                <div class="section-heading">
                    <p class="eyebrow">Design</p>
                    <h1>CSS Box Shadow Generator</h1>
                    <p>Règle la profondeur, le flou et la couleur d'une ombre
                        avec un aperçu en direct.</p>
                </div>
                <div class="css-generator" id="tool-panel">
                    <section class="css-generator-panel">
                        <h2>Réglages</h2>
                        <div class="generator-grid">
                            <label class="generator-field"><span>Décalage X
                                    <output
                                        data-shadow-x-value>12px</output></span><input
                                    type="range" data-shadow-x min="-60"
                                    max="60" value="12"></label>
                            <label class="generator-field"><span>Décalage Y
                                    <output
                                        data-shadow-y-value>18px</output></span><input
                                    type="range" data-shadow-y min="-60"
                                    max="60" value="18"></label>
                            <label class="generator-field"><span>Flou <output
                                        data-shadow-blur-value>30px</output></span><input
                                    type="range" data-shadow-blur min="0"
                                    max="80" value="30"></label>
                            <label class="generator-field"><span>Propagation
                                    <output
                                        data-shadow-spread-value>0px</output></span><input
                                    type="range" data-shadow-spread min="-30"
                                    max="40" value="0"></label>
                            <label class="generator-field"><span>Opacité <output
                                        data-shadow-opacity-value>35%</output></span><input
                                    type="range" data-shadow-opacity min="0"
                                    max="100" value="35"></label>
                            <label class="generator-field"><span>Couleur</span>
                                <div class="color-input-row">
                                    <input type="color" data-shadow-color
                                        value="#ff7a00">
                                    <input type="text" data-shadow-color-hex
                                        value="#ff7a00" inputmode="text"
                                        maxlength="7"
                                        pattern="#[0-9a-fA-F]{3,6}"
                                        aria-label="Couleur au format HEX">
                                </div>
                            </label>
                        </div>
                        <label class="generator-check"><input type="checkbox"
                                data-shadow-inset> <span>Ombre interne
                                (<code>inset</code>)</span></label>
                        <label class="generator-field"><span>Fond de la
                                preview</span><select
                                data-shadow-preview-background><option
                                    value="dark" selected>Fond
                                    foncé</option><option value="light">Fond
                                    clair</option></select></label>
                        <div class="generator-actions">
                            <button type="button" data-shadow-copy>Copier
                                CSS</button>
                            <button type="button"
                                data-shadow-reset>Reset</button>
                        </div>
                        <p class="generator-status" data-shadow-status>En
                            attente.</p>
                    </section>
                    <section class="css-generator-panel generator-result">
                        <h2>Aperçu & sortie</h2>
                        <div class="shadow-preview-wrap"
                            data-shadow-preview-wrap><div class="shadow-preview"
                                data-shadow-preview>SoraTool</div></div>
                        <label class="generator-field"><span>CSS
                                généré</span><pre class="css-output"><code
                                class="language-css" data-shadow-output></code></pre></label>
                    </section>
                </div>
            </section>
        </main>
        <footer class="site-footer"><p>&copy; <span class="date"></span>
                SoraTool - Tous droits réservés.</p><p
                class="location"></p></footer>
    </body>
</html>
