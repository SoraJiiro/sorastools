<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Formatter - SoraTools</title>
  <meta name="description" content="Formate, valide, minifie et copie rapidement du JSON.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/json-formatter.css">
  <script type="module" src="/js/tools/json-formatter.js"></script>
</head>
<body>
  <header class="site-header">
    <nav class="navbar">
      <a class="logo" href="/">SoraTools</a>
      <div class="nav-links">
        <a href="/#tools">Tools</a>
        <a href="/tools/color-picker">Color picker</a>
        <a href="/tools/json-formatter">JSON</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="section tool-section" id="json-formatter">
      <div class="section-heading">
        <p class="eyebrow">Dev</p>
        <h1>JSON Formatter</h1>
        <p>Colle du JSON pour le valider, le formater, le minifier ou le copier proprement.</p>
      </div>

      <div class="json-tool">
        <div class="json-toolbar">
          <button type="button" data-json-format>Formatter</button>
          <button type="button" data-json-minify>Minifier</button>
          <button type="button" data-json-validate>Valider</button>
          <button type="button" data-json-clear>Vider</button>
          <button type="button" data-json-copy>Copier</button>
        </div>

        <div class="json-editor-grid">
          <label class="field json-field">
            <span>Input JSON</span>
            <textarea data-json-input spellcheck="false" placeholder='{"name":"SoraTools","tools":["JSON Formatter","Color Picker"]}'></textarea>
          </label>

          <label class="field json-field">
            <span>Résultat</span>
            <textarea data-json-output spellcheck="false" readonly></textarea>
          </label>
        </div>

        <p class="json-status" data-json-status>En attente de JSON.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>SoraTools - JSON Formatter.</p>
  </footer>
</body>
</html>
